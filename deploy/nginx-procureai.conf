# ProcureAI War Room — nginx site on the Lightsail box (installed by scripts/deploy.sh to
# /etc/nginx/sites-available/procureai, linked as the only enabled site).
#
# /            the Vite build in /var/www/procureai, SPA fallback to index.html
# /api/…       → 127.0.0.1:8000/… (prefix stripped; the frontend is built with VITE_API_URL=/api)
#
# SSE (GET /api/runs/{id}/events/stream) needs proxy_buffering off + a long read timeout, or nginx
# holds the events until the stream closes and the timeline degrades to polling. The backend also
# sends `X-Accel-Buffering: no`. Only :80 is exposed; 8000 and 18789 stay on loopback.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/procureai;
    index index.html;

    # document uploads (3 quotes ≈ a few hundred KB; 20m leaves room for a scanned PDF)
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: stream events as they arrive, keep the connection open while a run waits at a human gate
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        gzip off;
        add_header X-Accel-Buffering no;
    }

    # hashed Vite assets: cache forever; index.html: never (it names the current hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
