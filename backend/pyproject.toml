[project]
name = "procureai"
version = "0.1.0"
description = "ProcureAI backend: deterministic procurement engine + agent adapters"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "reportlab>=5.0.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.18.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["procureai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
